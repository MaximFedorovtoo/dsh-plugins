# Superuser mode + universal MCP hub.
#
# One Host row owns both capabilities:
#   - per-session superuser mode: the public permission-preset switch, applied
#     automatically to new agents when `autoEnable` is true;
#   - the runtime MCP hub: servers persisted in `mcpStorePath`, connected over
#     stdio or streamable HTTP, plus the bundled `desktop` MCP server.
#
# The Client half (declared in package.json `dsh.client`) adds the sidebar
# entry, the panel and the localized display metadata.
- insert:
    - id: superuser
      name: dsh-superuser
      config:
        # Apply full access (sandbox danger-full-access + approval never) to
        # every newly created agent, and to the agents already live when the
        # plugin activates. The user can still switch one chat off with the
        # `superuser_mode` tool or the panel.
        autoEnable: true
        # Runtime MCP server store. '' = <DSH_HOME>/superuser/mcp-servers.json;
        # a relative path resolves inside DSH_HOME.
        mcpStorePath: ""
        # Budget for one MCP handshake + tools/list (stdio spawn or HTTP POST).
        connectTimeoutMs: 20000
        # Budget for one remote MCP tool call.
        callTimeoutMs: 90000
