# unslop for DSH: deterministic AI-writing scanners + preservation gates +
# an LLM rewrite that must keep facts and do no harm, plus voice teach/mimic.
- insert:
    - id: unslop
      name: dsh-unslop
      config:
        # '' = DSH bundled Python (resources/runtime/.../dependencies/python)
        pythonPath: ""
        # '' = <plugin>/python/scripts
        scriptsRoot: ""
        timeoutMs: 60000
        maxInputChars: 40000
        maxOutputChars: 40000
        # LLM route used by unslop_rewrite
        llmProvider: deepseek-account
        llmModel: deepseek-flash
        maxTokens: 4000
        # Voice teach/mimic: '' = <cwd>/.unslop/voice (project scope)
        voiceRoot: ""
        # Per-chat voice roots live under <chatRoot>/<session>/.unslop/voice
        chatRoot: ""
        # '' = <plugin>/python/evals/fixtures/voice/impostors
        impostorsRoot: ""
        voiceSeed: 7
        voiceTimeoutMs: 120000